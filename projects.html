<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./triquetra.png" type="image/x-icon" />
    <title>Osman Esad - Kodlar</title>
    <meta name="description" content="Osman Esad'in GitHub üzerindeki güncel açık kaynak ve deneysel proje listesi." />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="siteShell">
      <aside class="siteRail" aria-label="Site menüsü">
        <div>
          <div class="railTop"><a class="brand" href="index.html">Osman Esad</a></div>
          <nav class="railNav" aria-label="Ana gezinme">
            <a href="index.html">Anasayfa</a>
            <a href="archive.html">Yazılar</a>
            <a href="projects.html" aria-current="page">Kodlar</a>
            <a href="about.html">Hakkımda</a>
            <a href="mailto:byesad@gmail.com">İletişim</a>
          </nav>
        </div>
        <img class="railSketch" src="assets/art/pera-sketch.svg" alt="Pera ve Galata çizimi" />
        <nav class="railSocial" aria-label="Sosyal bağlantılar">
          <a class="social" href="https://osmanesad.medium.com/" target="_blank" rel="noopener" title="Medium"><img src="assets/icons/medium.svg" alt="Medium" /></a>
          <a class="social" href="https://github.com/osmanesad" target="_blank" rel="noopener" title="GitHub"><img src="assets/icons/github.svg" alt="GitHub" /></a>
          <a class="social" href="https://www.linkedin.com/in/osmanesad/" target="_blank" rel="noopener" title="LinkedIn"><img src="assets/icons/linkedin.svg" alt="LinkedIn" /></a>
          <a class="social" href="https://www.instagram.com/masondase/" target="_blank" rel="noopener" title="Instagram"><img src="assets/icons/instagram.svg" alt="Instagram" /></a>
        </nav>
      </aside>

      <main class="siteMain">
        <div class="topTools">
          <button class="toolIcon" id="themeToggle" type="button" aria-label="Tema değiştir" title="Tema değiştir">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M21 13.1A7.5 7.5 0 0 1 10.9 3a8.8 8.8 0 1 0 10.1 10.1Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" /></svg>
          </button>
        </div>
        <div class="pageWrap">
          <header class="subpageHero">
            <div>
              <div class="eyebrow">Kod atölyesi</div>
              <h1 class="pageTitle">Kodlar</h1>
              <p class="pageLead">Açık kaynak denemeler, web işleri, küçük araçlar ve arada kahveyle kesişen dijital üretimler. Liste GitHub üzerinden güncel olarak çekilir.</p>
            </div>
            <img src="assets/art/basquiat-code.svg" alt="Taçlı dışavurumcu portre ve kod çizgileri" />
          </header>

          <div class="archiveControls">
            <input id="q" class="archiveSearch" type="search" placeholder="Repo içinde ara..." />
            <button class="asideBtn" id="clear" type="button">Temizle</button>
            <span class="muted" id="countLine">Yükleniyor...</span>
          </div>

          <ul class="archiveList2" id="list"></ul>
        </div>
      </main>
    </div>
    <button class="toTop" id="toTop" aria-label="Sayfa başına dön" title="Yukarı">↑</button>
    <script type="module" src="projects.js"></script>
  </body>
</html>
